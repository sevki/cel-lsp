[package]
name = "cel-lsp"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.3.3"
tower-lsp = { version = "0.20", default-features = false }
tokio = { version = "1", features = ["sync", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.4"
console_error_panic_hook = "0.1"

# CEL Rust implementation
cel = "0.11"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
